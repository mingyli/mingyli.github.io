name: Ming Li
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
plugins:
  - jekyll-sitemap
      
collections:
  posts:
    output: true
    permalink: /notes/:title
  cs70:
    output: true
    permalink: /:collection/:name

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "tufte"
  -
    scope:
      path: ""
      type: "cs70"
    values:
      layout: "center"
  -
    scope:
      path: ""
    values:
      layout: "center"
